# TRAFFICINTEL AI - Full stack
#
#   docker compose up -d
#   → console  http://localhost:8080
#   → API      http://localhost:8080/api/v1  (proxied through the console)
#
# The API port is NOT published to the host. Everything reaches it through the
# console's nginx, so there is one origin, no CORS, and one place to put TLS.
# Publish 8000 yourself if you need to hit the API directly during development.
#
# The database is NOT part of this stack. It is external - a natively
# installed PostgreSQL, or a managed provider (Supabase, Neon, Railway, RDS,
# ...) - reached over the network via a single DATABASE_URL. The app's
# dual-dialect SQLAlchemy engine and Alembic migrations do not care which; see
# README section 9 for the exact connection-string shape for each case, and
# the "reachable address" warning if the database runs on this same host.

name: trafficintel

services:
  # ---------------------------------------------------------------------
  # Schema migration - waits for the external database, then runs to
  # completion and exits
  # ---------------------------------------------------------------------
  #
  # Deliberately a separate one-shot service rather than a line in the API's
  # entrypoint. If the API migrated on boot, two replicas starting together
  # would race each other through the same migration, and the loser's failure
  # would surface as a crash-looping pod rather than as a failed deploy.
  #
  # There is no compose healthcheck to wait on any more - the database is not
  # a compose service - so migrate_with_retry.py retries the connection itself
  # with a short backoff before applying migrations, rather than crash-looping
  # the whole container on the first transient network hiccup.
  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "tools.migrate_with_retry"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env - see .env.example for the local and managed-provider shapes}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
    restart: "no"

  # ---------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env - see .env.example for the local and managed-provider shapes}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # Empty by design. The console and the API are served from a single
      # origin through nginx, so browser requests are same-origin and CORS is
      # never consulted. An empty allow-list therefore costs nothing and means
      # this deployment grants NO cross-origin access to the traffic network.
      # Set it only if something genuinely off-origin must call the API.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}

      # The controller poller runs in-process. Exactly ONE instance across the
      # whole deployment may have this enabled: two pollers write two rows per
      # observation, which would silently double every throughput and
      # arrival-on-green figure computed from the log. See README §9.3 before
      # scaling this service beyond one replica.
      CONTROLLER_POLL_ENABLED: ${CONTROLLER_POLL_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # No ports: reached through the console's proxy.

  # ---------------------------------------------------------------------
  # Operations console (static bundle + API proxy)
  # ---------------------------------------------------------------------
  console:
    build:
      context: ./frontend
    ports:
      - "${CONSOLE_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped
