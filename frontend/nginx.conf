# TRAFFICINTEL AI - Operations Console (static) + API reverse proxy
#
# The console and the API are served from one origin. That is deliberate: it
# removes CORS from the deployment entirely, and it means the bundle carries no
# environment-specific API URL, so the image that was tested is the image that
# ships.

# Required for the WebSocket upgrade below: nginx must send `Connection: close`
# on ordinary requests and `Connection: upgrade` only on upgrade requests.
# Without this map $connection_upgrade is empty and nginx fails to start.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# NOTE: there is deliberately no `upstream` block here.
#
# nginx resolves the hostname in an `upstream` server directive ONCE, when the
# config loads, and caches that address for the process lifetime. In a
# container orchestrator the API's address changes whenever it is recreated,
# rescheduled or scaled - and nginx then proxies to an address nothing is
# listening on, returning 504 for every request until someone reloads it. That
# is a total console outage produced by an ordinary redeploy, and it was
# observed exactly that way: killing an API replica made the console return 504
# indefinitely.
#
# Putting the upstream in a *variable* forces nginx to resolve it per request
# through the resolver below, so the console follows the API wherever it moves.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version to anyone probing the console.
    server_tokens off;

    # Baseline hardening. No CSP is set here: the console's exact inline/style
    # requirements should be measured against a real deployment first, and a
    # policy that is wrong gets disabled wholesale rather than fixed.
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header Referrer-Policy           "same-origin"      always;
    add_header Cross-Origin-Opener-Policy "same-origin"     always;

    client_max_body_size 16m;   # bounded: import endpoints accept uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx's own liveness, distinct from the API's. It answers while the API
    # is down, which is the point: it distinguishes "console not served" from
    # "console served, API unreachable".
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "console-serving\n";
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # operators keep running the previous release after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        # Docker's embedded DNS. On another orchestrator, point this at its
        # cluster DNS (e.g. kube-dns at 10.96.0.10).
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        # Held in a variable so it is re-resolved rather than pinned at load
        # time - see the note at the top of this file. $request_uri is required
        # because a variable in proxy_pass disables nginx's automatic URI
        # rewriting.
        set $api_backend "http://backend:8000";
        proxy_pass         $api_backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for the live event stream.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The event stream is long-lived and mostly idle; a short read timeout
        # would tear it down during quiet periods and make the console look
        # like it keeps losing the server.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Buffering off so events reach the console as they are published
        # rather than when a buffer happens to fill.
        proxy_buffering off;
    }

    # SPA routing: the console owns its own routes, so unknown paths return the
    # shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
